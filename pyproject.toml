[project]
name = "wiz-control-app"
version = "0.1.0"
requires-python = ">=3.14"

# Virtual root: it only holds the workspace and the shared dev tools.
[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/*-py", "packages/*-py"]

# Every workspace member is in the dev group, so a plain `uv sync` installs them all.
[tool.uv.sources]
wiz-protocol = { workspace = true }

[dependency-groups]
dev = [
    "wiz-protocol",
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.14",
    "pyright>=1.1.400",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["apps", "packages"]
# importlib mode: test files in different members may share a name.
addopts = "--import-mode=importlib -m 'not integration'"
markers = ["integration: talks to real bulbs on the LAN (run with -m integration)"]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["wiz_protocol", "wiz_server"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
